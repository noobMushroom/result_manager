[package]
name = "result_management"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "result_management"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
config = "0.15.19"
actix = "0.13.5"
chrono = "0.4.42"
uuid = { version = "1.19.0", features = ["v4"] }

[dev-dependencies]
reqwest = "0.12.28"

[dependencies.sqlx]
version = "0.8.6"
default-features = false
features = [
    "tls-rustls",
    "runtime-tokio",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate"
]