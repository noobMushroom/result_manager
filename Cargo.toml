[package]
name = "result_management"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "result_management"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
config = "0.15.19"
actix = "0.13.5"
chrono = {version = "0.4.42", features = ["serde"]}
uuid = { version = "1.19.0", features = ["v4"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.22", features = ["registry", "env-filter"] }
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
tracing-actix-web = "0.7.20"
secrecy = { version = "0.10.3", features = ["serde"] }
serde-aux = "4.7.0"
thiserror = "2.0.17"
anyhow = "1.0.100"
argon2 = {version = "0.5.3", features = ["std"]}
rand = "0.9.2"
reqwest = {version = "0.13.0", features= ["json"]}

[dev-dependencies]
once_cell = "1.21.3"
wiremock = "0.6.5"

[dependencies.sqlx]
version = "0.8.6"
default-features = false
features = [
    "tls-rustls",
    "runtime-tokio",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate"
]
